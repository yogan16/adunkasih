<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Masuk - ADUNKASIH</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia" height="40" width="40">
      <img src="images/logo2.png" alt="Logo Kedah" height="40" width="40">
      <div class="logo">ADUNKASIH</div>
    </div>
    <!-- Hamburger icon for mobile -->
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="index.html">Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="generalDashboard.html">Maklumat Agihan</a>
      <a href="contactus.html">Hubungi Kami</a>
      <a href="login.html" class="login-btn">Log masuk</a>
    </nav>
  </header>

  <div class="container">
    <div class="register-content">
      <div class="register-image">
        <img src="images/register.png" alt="Login Image" height="190" width="190">
      </div>
      <div class="register-box">
        <div class="register-form">
            <label for="fullname">Nama Penuh</label>
            <input type="text" id="fullname" placeholder="contoh: Ahmad A/L Shaifudin" required>
            <label for="idnumber">No. Kad Pengenalan</label>
            <input type="text" id="idnumber" placeholder="contoh: 000203025264" required>
            <label for="phone">No. Tel</label>
            <input type="text" id="phone" placeholder="contoh: 60131156985" required>
            <label for="password">Kata Laluan</label>
            <input type="password" id="password" placeholder="contoh: User@123" required>
            <button type="submit" onclick="registerUser()">DAFTAR</button>
            <p>Sudah mempunyai akaun? <a href="login.html">Log Masuk</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
  </footer>

  <script>
    const database = firebase.database();

    function registerUser() {
      const fullname = document.getElementById('fullname').value.trim();
      const idnumber = document.getElementById('idnumber').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      if (fullname && idnumber && phone && password) {
        // Password validation: at least 6 characters with uppercase, lowercase, digit and special character
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
        if (!passwordRegex.test(password)) {
          alert('Kata Laluan mestilah sekurang-kurangnya 6 aksara, mengandungi huruf besar, huruf kecil, nombor dan aksara khas.');
          return;
        }

        // Check if IC number already exists
        const userRef = database.ref('Users/citizen');
        userRef.orderByChild('idnumber').equalTo(idnumber).once('value', snapshot => {
          if (snapshot.exists()) {
            alert('Kad Pengenalan telah wujud ! Teruskan ke Log Masuk.');
          } else {
            // Register new user
            const newUserRef = userRef.push();
            newUserRef.set({
              fullname: fullname,
              idnumber: idnumber,
              phone: phone,
              password: password
            })
            .then(() => {
              alert('Pendaftaran berjaya!');
              window.location.href = 'index.html';
            })
            .catch((error) => {
              console.error('Error:', error);
              alert('Ralat semasa pendaftaran. Sila cuba lagi.');
              window.location.href = 'register.html';
            });
          }
        });
      } else {
        alert('Sila isi semua maklumat.');
      }
    }

    // Toggle navigation menu on mobile devices
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });
  </script>
</body>
</html>
