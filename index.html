<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Rasmi ADUNKASIH @ Kedah 2024</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka&family=Pacifico&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo1.png" alt="Logo Malaysia" height="40" width="40">
            <img src="images/logo2.png" alt="Logo Kedah" height="40" width="40">
        </div>
        <!-- Hamburger icon for mobile -->
        <div class="menu-toggle">&#9776;</div>
        <!-- Navigation links container -->
        <nav class="nav-links">
            <a href="index.html">Utama</a>
            <a href="aboutus.html">Tentang Kami</a>
            <a href="generalDashboard.html">Maklumat Agihan</a>
            <a href="contactus.html">Hubungi Kami</a>
            <a class="login-btn" href="login.html">LOG MASUK</a>
        </nav>
    </header>

    <main>
        <h2>Portal Rasmi</h2>
        <h1>ADUNKASIH @ KEDAH <br>2024</h1>
        <center><div class="innovative-system">- SISTEM KEBAJIKAN YANG INOVATIF -</div></center>

        <div class="announcement-container">
            <div class="announcement">PENGUMUMAN TERKINI</div>
            <div class="announcement-line"></div>
        </div>

        <!-- Container to display announcements dynamically -->
        <div id="announcementsWrapper"></div>
    </main>

    <!-- MODAL for viewing full announcement text with icon -->
    <div id="announcementModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="modalCloseBtn">&times;</span>
            <div class="modal-header">
                <img src="images/announce.png" alt="Announcement Icon" class="modal-announcement-icon">
            </div>
            <div class="full-announcement-text" id="modalFullText"></div>
        </div>
    </div>

    <footer>
        Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebaseConfig.js"></script>

    <script>
        var database = firebase.database();

        // 3. Load announcements from "pengumuman" node
        function loadAnnouncements() {
            const announcementsRef = database.ref("pengumuman");
            announcementsRef.once("value", snapshot => {
                const wrapper = document.getElementById("announcementsWrapper");
                wrapper.innerHTML = "";            // clear old

                // 1) gather into an array
                const list = [];
                snapshot.forEach(child => {
                    const d = child.val();
                    list.push({
                        teks:   d.teksPengumuman  || "",
                        tarikh: d.tarikhKemaskini || ""
                    });
                });

                // 2) reverse so latest is first, then render
                list.reverse().forEach(item => {
                    wrapper.appendChild(
                        createAnnouncementBox(item.teks, item.tarikh)
                    );
                });
            });
        }

        // 4. Create a content box for each announcement
        function createAnnouncementBox(fullText, dateStr) {
            const MAX_LENGTH = 70; // Maximum length before truncation

            // Create main container
            const box = document.createElement("div");
            box.className = "content-box";

            // Create row container
            const row = document.createElement("div");
            row.className = "announcement-row";

            // Announcement text container
            const textDiv = document.createElement("div");
            textDiv.className = "announcement-text";

            // If text is too long, show partial + "See all"
            if (fullText.length > MAX_LENGTH) {
                const partialText = fullText.substring(0, MAX_LENGTH) + "...";
                textDiv.textContent = partialText;

                const seeAllLink = document.createElement("span");
                seeAllLink.className = "see-all-link";
                seeAllLink.textContent = "See all";
                seeAllLink.onclick = () => openModal(fullText);
                textDiv.appendChild(document.createTextNode(" "));
                textDiv.appendChild(seeAllLink);
            } else {
                // If short enough, show the entire text
                textDiv.textContent = fullText;
            }

            // Date container
            const dateDiv = document.createElement("div");
            dateDiv.className = "announcement-date";
            dateDiv.textContent = dateStr;

            // Append text and date to row
            row.appendChild(textDiv);
            row.appendChild(dateDiv);

            // Append row to box
            box.appendChild(row);
            return box;
        }

        // 5. Modal to view full text
        function openModal(fullText) {
            document.getElementById("modalFullText").textContent = fullText;
            document.getElementById("announcementModal").style.display = "flex";
        }
        function closeModal() {
            document.getElementById("announcementModal").style.display = "none";
        }

        // 6. Handle modal close
        document.getElementById("modalCloseBtn").onclick = function() {
            closeModal();
        };

        // 7. Toggle navigation menu on mobile devices & load announcements
        document.addEventListener("DOMContentLoaded", function () {
            const menuToggle = document.querySelector(".menu-toggle");
            const navLinks = document.querySelector(".nav-links");

            if (menuToggle && navLinks) {
                menuToggle.addEventListener("click", function () {
                    navLinks.classList.toggle("active");
                });
            }

            // Load announcements once DOM is ready
            loadAnnouncements();
        });
    </script>
</body>
</html>
