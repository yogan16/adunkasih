<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kemaskini Profil - ADUNKASIH</title>

  <!-- Session Check Script -->
  <script>
    // Immediately check if the user is logged in by looking for "userIC" in localStorage.
    if (!localStorage.getItem("userIC")) {
      alert("Sila log masuk terlebih dahulu.");
      window.location.href = "login.html";
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* ====== GLOBAL STYLES ====== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Fredoka', sans-serif;
      margin: 0;
      padding: 0;
      margin-top: 15vh; /* accommodates fixed header */
      background: url('images/kedah.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow-y: auto;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    /* ====== HEADER ====== */
    header {
      position: fixed;
      font-family: 'Times New Roman', serif;
      top: 0;
      width: 100%;
      background: black;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-container img {
      height: 40px;
      width: 40px;
      object-fit: contain;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: background 0.3s, color 0.3s;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .nav-links a:hover {
      background: white;
      color: #2c1e3c;
      border-radius: 15px;
      padding: 10px 20px;
    }
    .logout-btn {
      background: #bc0a0f;
      color: #fff;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .logout-btn:hover {
      background: grey !important;
      color: white!important;
      transition: background 0.3s ease !important;
    }
    .logout-btn::before {
      content: "";
      display: inline-block;
      background: url('images/logout.png') no-repeat center center;
      background-size: contain;
      width: 25px;
      height: 25px;
      margin-right: 8px;
    }
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: white;
      cursor: pointer;
      margin-left: 20px;
    }
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background: black;
        position: absolute;
        top: 60px;
        left: 0;
        z-index: 1000;
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links a {
        margin: 10px 0;
        padding: 10px 20px;
        width: 50%;
        text-align: left;
      }
      .nav-links a:hover {
        background: white;
        color: #2c1e3c;
        border-radius: 15px;
      }
      .menu-toggle {
        display: block;
        margin-right: 32px;
      }
    }

    /* ====== FOOTER ====== */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      text-align: center;
      padding: 10px 0;
    }

    /* ====== MAIN WRAPPER ====== */
    .main-wrapper {
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
      margin-bottom: 100px;
    }

    /* ====== TITLE CONTAINER ====== */
    .page-title-container {
      background: #fff;
      text-align: center;
      padding: 5px;
      margin: 20px 0;
      border-radius: 14px;
      border: 5px solid black;
    }
    .page-title-container h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 28px;
      color: #333;
      margin: 0;
      text-transform: uppercase;
    }

    /* ====== PROFILE CONTAINER ====== */
    .profil-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(3px);
      border-radius: 15px;
      margin: 40px auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      overflow: hidden;
      border: 1px solid #ccc;
      text-align: center;
      padding: 30px 20px;
      border: 3px solid black;
    }
    .inner-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(3px);
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 20px;
      padding: 20px;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 2px solid #bc0a0f;
    }
    .profil-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #000;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .profil-fields {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 30px auto;
    }
    .profil-fields table {
      width: 100%;
      border-collapse: collapse;
    }
    .profil-fields th,
    .profil-fields td {
      padding: 10px;
      vertical-align: middle;
      font-size: 16px;
      color: #333;
    }
    .profil-fields th {
      text-align: left;
      width: 30%;
      font-weight: 600;
    }
    .profil-fields input[type="text"] {
      width: 100%;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 8px;
      font-family: 'Fredoka', sans-serif;
    }
    .profil-fields input[disabled] {
      background: #f1f1f1;
      color: #777;
      cursor: not-allowed;
    }
    .edit-icon {
      width: 25px;
      height: 25px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .edit-icon:hover {
      transform: scale(1.1);
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .btn-action {
      background: #bc0a0f;
      color: #fff;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn-action:hover {
      background: #333;
    }
    .btn-back {
      background: #aaa;
    }
    .btn-back:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia">
      <img src="images/logo2.png" alt="Logo Kedah">
      <div class="logo">ADUNKASIH</div>
    </div>
    <!-- Hamburger icon for mobile -->
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="dashboard.html">Papan Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="contactus.html">Hubungi Kami</a>
      <a id="logoutBtn" class="logout-btn">Log Keluar</a>
    </nav>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- TITLE CONTAINER -->
    <div class="page-title-container">
      <h1>KEMASKINI PROFIL</h1>
    </div>

    <!-- PROFILE CONTAINER -->
    <div class="profil-container">
      <div class="inner-container">
        <!-- Avatar -->
        <img src="images/profile.png" alt="Profile Avatar" class="avatar" />
        <!-- Display Name -->
        <div class="profil-name" id="displayName">LOADING...</div>
        <!-- Fields Table -->
        <div class="profil-fields">
          <table>
            <tr>
              <th>Nama</th>
              <td>
                <!-- 'fullname' in Firebase -->
                <input type="text" id="fullname" value="" disabled />
              </td>
              <td style="width: 40px;">
                <img src="images/edit.png" alt="Edit" class="edit-icon" onclick="enableField('fullname')" />
              </td>
            </tr>
            <tr>
              <th>No. MyKad</th>
              <td>
                <!-- 'idnumber' in Firebase -->
                <input type="text" id="idnumber" value="" disabled />
              </td>
              <td>
                <img src="images/edit.png" alt="Edit" class="edit-icon" onclick="enableField('idnumber')" />
              </td>
            </tr>
            <tr>
              <th>No. Tel</th>
              <td>
                <!-- 'phone' in Firebase -->
                <input type="text" id="phone" value="" disabled />
              </td>
              <td>
                <img src="images/edit.png" alt="Edit" class="edit-icon" onclick="enableField('phone')" />
              </td>
            </tr>
            <tr>
              <th>Password</th>
              <td>
                <!-- 'password' in Firebase -->
                <input type="text" id="password" value="" disabled />
              </td>
              <td>
                <img src="images/edit.png" alt="Edit" class="edit-icon" onclick="enableField('password')" />
              </td>
            </tr>
          </table>
        </div>
      </div>
      <!-- Buttons -->
      <div class="button-row">
        <button class="btn-action btn-back" onclick="goBack()">KEMBALI</button>
        <button class="btn-action" onclick="saveProfile()">SIMPAN</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
  </footer>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Your logout logic (if any) -->
  <script src="logout.js"></script>
  <script src="firebaseConfig.js"></script>

  <script>
    const database = firebase.database();
    // 2. Global variable to store the profile key from Firebase
    var profileKey = null;

    // 3. On page load, fetch the user’s profile data
    document.addEventListener("DOMContentLoaded", function() {
      const userIC = localStorage.getItem("userIC");
      console.log("Checking for userIC in localStorage:", userIC);

      // If userIC is null or empty, redirect (safety check)
      if (!userIC) {
        alert("Sila log masuk terlebih dahulu.");
        window.location.href = "login.html";
        return;
      }

      // Query the 'registrations' node for a record where 'idnumber' == userIC
      firebase.database().ref('Users/citizen')
        .orderByChild('idnumber')
        .equalTo(userIC)
        .once('value')
        .then(function(snapshot) {
          console.log("Snapshot from Firebase:", snapshot.val());
          if (snapshot.exists()) {
            snapshot.forEach(function(childSnapshot) {
              var userData = childSnapshot.val();
              console.log("User data found:", userData);

              // Fill the form fields
              document.getElementById('fullname').value  = userData.fullname  || "";
              document.getElementById('idnumber').value  = userData.idnumber  || "";
              document.getElementById('phone').value     = userData.phone     || "";
              document.getElementById('password').value  = userData.password  || "";

              // Display name
              document.getElementById('displayName').textContent =
                userData.fullname ? userData.fullname.toUpperCase() : "TIADA NAMA";

              // Keep the key for updating later
              profileKey = childSnapshot.key;
            });
          } else {
            alert("Data profil tidak ditemui dalam 'registrations'.");
            document.getElementById('displayName').textContent = "TIADA DATA";
          }
        })
        .catch(function(error) {
          console.error("Error fetching profile data:", error);
          alert("Ralat ketika mengambil data profil.");
        });
    });

    // 4. Enable editing of a specific field
    function enableField(fieldId) {
      var field = document.getElementById(fieldId);
      field.disabled = false;
      field.focus();
    }

    // 5. Go back function
    function goBack() {
      // Example: Go back to the previous page
      window.history.back();
    }

    // 6. Save the updated profile to Firebase
    function saveProfile() {
      if (!profileKey) {
        alert("Kunci profil tidak dijumpai. Tiada data untuk disimpan.");
        return;
      }

      // Gather updated data from fields
      var updatedFullname = document.getElementById('fullname').value.trim();
      var updatedIdnumber = document.getElementById('idnumber').value.trim();
      var updatedPhone    = document.getElementById('phone').value.trim();
      var updatedPassword = document.getElementById('password').value.trim();

      // Simple validation (optional)
      if (!updatedFullname || !updatedIdnumber) {
        alert("Sila isi sekurang-kurangnya Nama dan No. MyKad.");
        return;
      }

      // Update in Firebase under the same key
      firebase.database().ref('Users/citizen/' + profileKey).update({
        fullname: updatedFullname,
        idnumber: updatedIdnumber,
        phone:    updatedPhone,
        password: updatedPassword
      }, function(error) {
        if (error) {
          console.error("Error updating profile:", error);
          alert("Gagal menyimpan maklumat. Sila cuba lagi.");
        } else {
          // Disable fields after saving
          document.getElementById('fullname').disabled  = true;
          document.getElementById('idnumber').disabled  = true;
          document.getElementById('phone').disabled     = true;
          document.getElementById('password').disabled  = true;

          // Update display name
          document.getElementById('displayName').textContent = updatedFullname.toUpperCase();

          alert("Maklumat telah disimpan.");
        }
      });
    }

    // 7. Toggle nav menu on mobile
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks   = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });
  </script>
</body>
</html>
