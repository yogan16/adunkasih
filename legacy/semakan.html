<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semakan Kelayakan Permohonan - ADUNKASIH</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="css/semakan.css">

  <!-- Session Check Script -->
  <script>
    // Immediately check if the user is logged in by looking for "userIC" in localStorage.
    if (!localStorage.getItem("userIC")) {
      alert("Sila log masuk terlebih dahulu.");
      window.location.href = "login.html";
    }
  </script>

</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia">
      <img src="images/logo2.png" alt="Logo Kedah">
      <div class="logo">ADUNKASIH</div>
    </div>
    <!-- Hamburger icon for mobile -->
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="dashboard.html">Papan Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="contactus.html">Hubungi Kami</a>
      <a id="logoutBtn" class="logout-btn">Log Keluar</a>
    </nav>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- OUTER CONTAINER -->
    <div class="semakan-container">
      <div class="semakan-header">SEMAKAN KELAYAKAN PERMOHONAN</div>

      <!-- INNER CONTAINER -->
      <div class="inner-container">
        <div class="semakan-body">
          <label for="icNumber">No. Kad Pengenalan</label>
          <input 
            type="text" 
            id="icNumber" 
            class="ic-input" 
            placeholder="Contoh: 900101-01-1234" 
            disabled
          />
          <div class="button-row">
            <button class="btn-check" onclick="checkIC()">SEMAK</button>
            <button class="btn-back" onclick="goBack()">KEMBALI</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
  </footer>

  <!-- ====== MODAL 1 (Message Box with 2 Buttons) ====== -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <img 
        src="images/messagebox.png" 
        alt="Message Box Icon" 
        style="width: 60px; height:auto; margin-bottom:10px;"
      />
      <div id="modalMessage" class="modal-message"></div>
      <div class="modal-buttons">
        <button id="btnClose" class="modal-button">Tutup</button>
        <button id="btnContinue" class="modal-button">Teruskan</button>
      </div>
    </div>
  </div>

  <!-- ====== MODAL 2 (Single OKAY Button) ====== -->
  <div id="modalOverlay2" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <img 
        src="images/messagebox.png" 
        alt="Message Box Icon" 
        style="width: 60px; height:auto; margin-bottom:10px;"
      />
      <div id="modalMessage2" class="modal-message"></div>
      <div class="modal-buttons">
        <button id="btnOkOnly" class="modal-button">OKAY</button>
      </div>
    </div>
  </div>

  <!-- ====== SCRIPTS ====== -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="logout.js"></script>
  <script src="firebaseConfig.js"></script>

  <script>
    const database = firebase.database();

    // 1. Fill the IC field automatically from localStorage and disable it
    document.addEventListener("DOMContentLoaded", function() {
      const userIC = localStorage.getItem("userIC");
      const icNumberInput = document.getElementById("icNumber");
      if (userIC && icNumberInput) {
        icNumberInput.value = userIC;
        icNumberInput.disabled = true; // ensure user can't edit
      }

      // Toggle mobile navigation
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });

    // Go back function
    function goBack() {
      window.history.back();
    }

    // Show the first modal with 2 buttons
    function showModal(message) {
      const modalOverlay = document.getElementById("modalOverlay");
      const modalMessage = document.getElementById("modalMessage");
      const btnClose = document.getElementById("btnClose");
      const btnContinue = document.getElementById("btnContinue");

      // Set message
      modalMessage.textContent = message;

      // Display modal
      modalOverlay.style.display = "flex";

      // "Tutup" button closes the modal
      btnClose.onclick = function() {
        modalOverlay.style.display = "none";
      };

      // "Teruskan" button -> check permohonan table logic
      btnContinue.onclick = function() {
        modalOverlay.style.display = "none";
        proceedToPermohonan();
      };
    }

    // Show the second modal (single OKAY button)
    function showSecondModal(status) {
      const modalOverlay2 = document.getElementById("modalOverlay2");
      const modalMessage2 = document.getElementById("modalMessage2");
      const btnOkOnly = document.getElementById("btnOkOnly");

      modalMessage2.textContent = `Maaf, anda masih mempunyai permohonan berstatus "${status}". Anda tidak boleh membuat permohonan baru.`;

      modalOverlay2.style.display = "flex";

      btnOkOnly.onclick = function() {
        modalOverlay2.style.display = "none";
        window.location.href = "dashboard.html";
      };
    }

    // Called when "Teruskan" is clicked on the first modal
    // Checks if user can do a new application
    function proceedToPermohonan() {
      const icNumber = document.getElementById("icNumber").value.trim();
      if (!icNumber) {
        alert("Ralat: No. Kad Pengenalan tidak ditemui.");
        return;
      }
      // ----- UPDATED: Query the "permohonan" table filtering by pemohon/noMykad -----
      database.ref("permohonan")
        .orderByChild("pemohon/noMykad")
        .equalTo(icNumber)
        .once("value")
        .then(snapshot => {
          if (!snapshot.exists()) {
            // No record => they can apply
            window.location.href = "permohonan.html";
          } else {
            let allowNew = true;
            let activeStatus = "";
            // Iterate through all matching applications
            snapshot.forEach(childSnapshot => {
              const data = childSnapshot.val();
              const status = data.applicationStatus || "";
              // If there's any active application (not canceled or already distributed) then block new application
              if (status !== "Permohonan Dibatalkan" && status !== "Bantuan telah Diagihkan") {
                allowNew = false;
                activeStatus = status;
              }
            });
            if (allowNew) {
              window.location.href = "permohonan.html";
            } else {
              // Show second modal => cannot apply new
              showSecondModal(activeStatus);
            }
          }
        })
        .catch(error => {
          console.error("Error checking permohonan: ", error);
          alert("Ralat semasa menyemak rekod permohonan. Sila cuba lagi.");
        });
      // -----------------------------------------------------------------------------
    }

    // 2. Check IC in "citizenData" when user clicks SEMAK
    function checkIC() {
      const icNumberInput = document.getElementById("icNumber");
      const icNumber = icNumberInput.value.trim();

      if (!icNumber) {
        alert("No. Kad Pengenalan tidak ditemui!");
        return;
      }

      // Query Firebase where the "kadPengenalan" field matches the entered IC number
      database.ref("citizenData").orderByChild("kadPengenalan").equalTo(icNumber).once("value")
        .then(snapshot => {
          if (snapshot.exists()) {
            // IC exists in the database – eligible
            showModal("Anda layak untuk permohonan bantuan, anda meneruskan ke borang permohonan.");
          } else {
            // IC not found – not in citizenData
            showModal("Anda tidak layak untuk permohonan bantuan! Jika anda ingin meneruskan, pastikan muat naik dokumen yang diperlukan.");
          }
        })
        .catch(error => {
          console.error("Ralat semasa menyemak data:", error);
          alert("Ralat semasa menyemak data. Sila cuba lagi.");
        });
    }
  </script>
</body>
</html>
