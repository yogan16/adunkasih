<!-- generalDashboard.html -->

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papan Pemuka Umum</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Main Styles -->
  <link rel="stylesheet" href="css/general.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia" height="40" width="40">
      <img src="images/logo2.png" alt="Logo Kedah" height="40" width="40">
      <div class="logo">ADUNKASIH</div>
    </div>
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="index.html">Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="generalDashboard.html">Maklumat Agihan</a>
      <a href="contactus.html">Hubungi Kami</a>
      <a href="login.html" class="login-btn">Log masuk</a>
    </nav>
  </header>

  <main class="main-content">
    <h1 class="page-title">Statistik Keseluruhan Bantuan</h1>

    <div class="stats-container">
      <div class="stat-box box-green">
        <div class="stat-title">Jumlah Lulus</div>
        <div class="stat-value" id="countLulus">0</div>
      </div>
      <div class="stat-box box-blue">
        <div class="stat-title">Dalam Proses</div>
        <div class="stat-value" id="countProses">0</div>
      </div>
      <div class="stat-box box-red">
        <div class="stat-title">Ditolak</div>
        <div class="stat-value" id="countTolak">0</div>
      </div>
      <div class="stat-box box-purple">
        <div class="stat-title">Diagih</div>
        <div class="stat-value" id="countAgih">0</div>
      </div>
      <div class="stat-box box-orange">
        <div class="stat-title">Jumlah Permohonan</div>
        <div class="stat-value" id="countMohon">0</div>
      </div>
    </div>

    <section>
      <h2 class="chart-title">Graf Status Permohonan</h2>
      <div class="chart-container">
        <div class="chart-filters">
          <label for="statusFilter">Status:</label>
          <select id="statusFilter">
            <option value="all">Semua</option>
            <option value="Lulus">Lulus</option>
            <option value="Dalam Proses">Dalam Proses</option>
            <option value="Ditolak">Ditolak</option>
            <option value="Agih">Diagih</option>
            <option value="Mohon">Mohon</option>
          </select>
          <label for="yearFilterLine">Tahun:</label>
          <select id="yearFilterLine"></select>
        </div>
        <canvas id="lineChart"></canvas>
      </div>
    </section>

    <section>
      <h2 class="chart-title">Graf Jenis Bantuan</h2>
      <div class="chart-container">
        <div class="chart-filters">
          <label for="yearFilterBar">Tahun:</label>
          <select id="yearFilterBar"></select>
        </div>
        <canvas id="barChart"></canvas>
      </div>
    </section>
  </main>

  <footer>Hal Cipta Terpelihara 2024 © Kerajaan Negeri Kedah</footer>

  <script>
    // Initialize Firebase & data containers
    const db = firebase.database();
    const lineData = {}, barData = {};
    let totalL = 0, totalP = 0, totalT = 0, totalA = 0;
    let lineChart, barChart;

    function parseDMY(ts) {
      if (!ts) return {};
      const [d] = ts.replace(/,/g, '').split(' ');
      const [dd, mm, yy] = d.split('-');
      return { year: yy, month: mm };
    }

    function populateYears(id, start, end) {
      const sel = document.getElementById(id);
      for (let y = start; y <= end; y++) {
        const o = document.createElement('option');
        o.value = y;
        o.textContent = y;
        sel.appendChild(o);
      }
    }

    async function initDashboard() {
      const [permSnap, jenisSnap] = await Promise.all([
        db.ref('permohonan').once('value'),
        db.ref('jenisKebajikan').once('value')
      ]);
      const perms = permSnap.val() || {};
      const jenis = jenisSnap.val() || {};

      const allTypes = Object.values(jenis)
        .map(i => i.jenisBantuan)
        .filter(Boolean);
      allTypes.push('Lain-lain');

      populateYears('yearFilterLine', 2025, 2030);
      populateYears('yearFilterBar', 2025, 2030);

      Object.values(perms).forEach(p => {
        let key = 'Dalam Proses';
        const s = p.applicationStatus;
        if (s === 'Permohonan Diluluskan') key = 'Lulus';
        else if (['Permohonan Ditolak', 'Permohonan Dibatalkan'].includes(s)) key = 'Ditolak';
        else if (s === 'Bantuan telah Diagihkan') key = 'Agih';

        if      (key === 'Lulus')  totalL++;
        else if (key === 'Ditolak') totalT++;
        else if (key === 'Agih')   totalA++;
        else                        totalP++;

        const ts = Object.values(p.applicationStatusTimestamps || {})[0];
        const { year, month } = parseDMY(ts);
        if (!year) return;

        lineData[year] = lineData[year] || {};
        lineData[year][month] = lineData[year][month] || {
          Lulus: 0, 'Dalam Proses': 0, Ditolak: 0, Agih: 0
        };
        lineData[year][month][key]++;

        if (!barData[year]) {
          barData[year] = {};
          allTypes.forEach(t => barData[year][t] = 0);
        }
        let jt = p.bantuan?.jenis;
        if (!jt || !barData[year].hasOwnProperty(jt)) jt = 'Lain-lain';
        barData[year][jt]++;
      });

      document.getElementById('countLulus').textContent = totalL;
      document.getElementById('countProses').textContent = totalP;
      document.getElementById('countTolak').textContent = totalT;
      document.getElementById('countAgih').textContent = totalA;
      document.getElementById('countMohon').textContent = totalL + totalP + totalT + totalA;

      const statusColors = {
        Lulus: '#28a745',
        'Dalam Proses': '#007bff',
        Ditolak: '#dc3545',
        Agih: '#6f42c1',
        Mohon: '#fd7e14'
      };

      function drawLine(st, yr) {
        if (lineChart) lineChart.destroy();
        const ctx = document.getElementById('lineChart').getContext('2d');
        const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
        const dataObj = lineData[yr] || {};
        const cats = st === 'all'
          ? ['Lulus','Dalam Proses','Ditolak','Agih','Mohon']
          : [st];

        const datasets = cats.map(k => {
          const arr = months.map(m => {
            const o = dataObj[m] || { Lulus:0,'Dalam Proses':0,Ditolak:0,Agih:0 };
            return k === 'Mohon'
              ? o.Lulus + o['Dalam Proses'] + o.Ditolak + o.Agih
              : o[k] || 0;
          });
          return {
            label: k,
            data: arr,
            borderColor: statusColors[k],
            backgroundColor: statusColors[k].replace('#','rgba(').replace(')',',0.2)'),
            fill: false,
            tension: 0.3
          };
        });

        lineChart = new Chart(ctx, {
          type: 'line',
          data: { labels: months, datasets },
          options: { responsive:true, maintainAspectRatio:false }
        });
      }

      function drawBar(yr) {
        if (barChart) barChart.destroy();
        const ctx = document.getElementById('barChart').getContext('2d');
        const obj = barData[yr] || {};
        const labels = Object.keys(obj);
        const data   = Object.values(obj);
        const palette = ['#17a2b8','#20c997','#ffc107','#e83e8c','#6610f2','#fd7e14'];

        barChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Bilangan',
              data,
              backgroundColor: labels.map((_,i) => palette[i % palette.length])
            }]
          },
          options: { responsive:true, maintainAspectRatio:false }
        });
      }

      document.getElementById('statusFilter').onchange   =
        () => drawLine(document.getElementById('statusFilter').value,
                      document.getElementById('yearFilterLine').value);
      document.getElementById('yearFilterLine').onchange =
        () => drawLine(document.getElementById('statusFilter').value,
                      document.getElementById('yearFilterLine').value);
      document.getElementById('yearFilterBar').onchange =
        () => drawBar(document.getElementById('yearFilterBar').value);

      drawLine('all', document.getElementById('yearFilterLine').value);
      drawBar(document.getElementById('yearFilterBar').value);

      document.querySelector('.menu-toggle')
        .addEventListener('click', () => {
          document.querySelector('.nav-links').classList.toggle('active');
        });
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
