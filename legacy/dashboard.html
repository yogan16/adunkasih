<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - ADUNKASIH</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&display=swap" rel="stylesheet">
  <!-- Main CSS -->
  <link rel="stylesheet" href="css/dashboard.css">
  <!-- Notifications CSS -->
  <link rel="stylesheet" href="css/notifications.css">

  <!-- Session Check -->
  <script>
    if (!localStorage.getItem("userIC")) {
      alert("Sila log masuk terlebih dahulu.");
      window.location.href = "login.html";
    }
  </script>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia">
      <img src="images/logo2.png" alt="Logo Kedah">
      <div class="logo">ADUNKASIH</div>
    </div>
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="dashboard.html">Papan Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="contactus.html">Hubungi Kami</a>
      <!-- Notification Bell -->
      <div id="notificationBell">🔔<span class="badge" id="notifCount"></span></div>
      <!-- Log Keluar -->
      <a id="logoutBtn" class="logout-btn">Log Keluar</a>
    </nav>
  </header>

  <!-- Notification Overlay -->
  <div id="notificationOverlay" class="notification-overlay">
    <button class="close-btn" id="closeNotifBtn">&times;</button>
    <h2>PEMBERITAHUAN</h2>
    <div id="readMessage">Semua Pemberitahuan dibaca</div>
    <div id="notificationList"></div>
    <button id="clearNotifBtn">Bersihkan Pemberitahuan</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">
    <div class="welcome-box">
      <div class="profile-bubble">
        <img src="images/profile.png" alt="Profile"/>
      </div>
      <div class="welcome-text">Selamat Datang ke ADUNKasih @ Kedah</div>
    </div>
    <div class="info-box">
      <div class="user-name" id="userName">[Loading Name]</div>
      <div class="user-ic"   id="userIC">[Loading IC]</div>
    </div>
    <div class="cards-box">
      <div class="card-container">
        <div class="dashboard-card" onclick="location.href='semakan.html'">
          <img src="images/permohonan.png" alt="Permohonan"><p>Permohonan</p>
        </div>
        <div class="dashboard-card" onclick="location.href='trackstatus.html'">
          <img src="images/semakan.png" alt="Semakan Status"><p>Semakan Status</p>
        </div>
        <div class="dashboard-card" onclick="location.href='profile.html'">
          <img src="images/profile2.png" alt="Kemaskini Profil"><p>Kemaskini Profil</p>
        </div>
      </div>
    </div>
  </div>

  <footer>Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah</footer>

  <!-- SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="logout.js"></script>
  <script src="firebaseConfig.js"></script>
  <script>
    // Format current time as DD:MM:YYYY HH:MM
    function nowStamp() {
      const d = new Date(),
            dd = String(d.getDate()).padStart(2,'0'),
            mm = String(d.getMonth()+1).padStart(2,'0'),
            yyyy = d.getFullYear(),
            hh = String(d.getHours()).padStart(2,'0'),
            mi = String(d.getMinutes()).padStart(2,'0');
      return `${dd}:${mm}:${yyyy} ${hh}:${mi}`;
    }

    // Render notifications & badge
    function loadNotifications() {
      const listEl = document.getElementById('notificationList'),
            badge  = document.getElementById('notifCount'),
            readMsg= document.getElementById('readMessage');
      const notis = JSON.parse(localStorage.getItem('notifications')||'[]');
      listEl.innerHTML = '';
      notis.forEach((n,i) => {
        const item = document.createElement('div');
        item.className = 'notification-item';
        item.dataset.index = i;
        item.innerHTML = `
          <div class="notif-text${n.read? ' read':''}">${n.text}</div>
          <time>${n.timestamp}</time>
          <div class="notif-actions">
            <button class="mark-read-btn">✅</button>
            <button class="delete-btn">❌</button>
          </div>`;
        listEl.appendChild(item);
      });
      // update badge (only unread count)
      const unreadCount = notis.filter(n=>!n.read).length;
      if (unreadCount) {
        badge.textContent = unreadCount;
        badge.style.display = 'inline-block';
        readMsg.style.display = 'none';
      } else {
        badge.style.display = 'none';
        readMsg.style.display = 'block';
      }
      // attach action handlers
      document.querySelectorAll('.mark-read-btn').forEach(btn=>{
        btn.onclick = e => {
          const idx = e.target.closest('.notification-item').dataset.index;
          notis[idx].read = true;
          localStorage.setItem('notifications', JSON.stringify(notis));
          loadNotifications();
        };
      });
      document.querySelectorAll('.delete-btn').forEach(btn=>{
        btn.onclick = e => {
          const idx = e.target.closest('.notification-item').dataset.index;
          notis.splice(idx,1);
          localStorage.setItem('notifications', JSON.stringify(notis));
          loadNotifications();
        };
      });
    }

    document.addEventListener('DOMContentLoaded',()=>{
      const bell     = document.getElementById('notificationBell'),
            overlay  = document.getElementById('notificationOverlay'),
            closeBtn = document.getElementById('closeNotifBtn'),
            clearBtn = document.getElementById('clearNotifBtn');

      bell.addEventListener('click',()=>{
        overlay.classList.add('open');
        loadNotifications();
      });
      closeBtn.addEventListener('click',()=>overlay.classList.remove('open'));
      clearBtn.addEventListener('click',()=>{
        localStorage.setItem('notifications','[]');
        loadNotifications();
      });

      // load badge on page start
      loadNotifications();

      // Populate user info & listen for pegawai updates
      const db = firebase.database(),
            userIC = localStorage.getItem('userIC');
      if (!userIC) return;
      db.ref('Users/citizen').orderByChild('idnumber').equalTo(userIC)
        .once('value').then(snap=>{
          snap.forEach(c=>{
            const u=c.val();
            document.getElementById('userName').textContent = u.fullname||'Nama Tidak Ditemui';
            document.getElementById('userIC'  ).textContent = u.idnumber||'-';
          });
        });

      // Listen for status changes pushed by pegawai
      db.ref('permohonan')
        .orderByChild('pemohon/noMykad').equalTo(userIC)
        .on('child_changed', snap=>{
          const d = snap.val(), st = d.applicationStatus;
          if (['Permohonan Diluluskan','Permohonan Dibatalkan','Bantuan telah Diagihkan']
              .includes(st)) {
            const map = {
              'Permohonan Diluluskan': `Permohonan Diluluskan.`,
              'Permohonan Dibatalkan': `Permohonan Dibatalkan.`,
              'Bantuan telah Diagihkan': `Bantuan Diagihkan.`
            };
            const notis = JSON.parse(localStorage.getItem('notifications')||'[]');
            notis.push({ text: map[st], timestamp: nowStamp(), read:false });
            localStorage.setItem('notifications', JSON.stringify(notis));
            loadNotifications();
          }
        });

      // mobile nav toggle
      const m = document.querySelector('.menu-toggle'),
            nav = document.querySelector('.nav-links');
      if (m && nav) m.addEventListener('click',()=>nav.classList.toggle('active'));
    });
  </script>
</body>
</html>
