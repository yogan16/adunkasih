<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Laluan - ADUNKASIH</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/forgetpassword.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia" height="40" width="40">
      <img src="images/logo2.png" alt="Logo Kedah" height="40" width="40">
      <div class="logo">ADUNKASIH</div>
    </div>
    <!-- Hamburger icon for mobile -->
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="index.html">Utama</a>
      <a href="aboutus.html">Tentang Kami</a>
      <a href="generalDashboard.html">Maklumat Agihan</a>
      <a href="contactus.html">Hubungi Kami</a>
      <a href="login.html" class="login-btn">Log masuk</a>
    </nav>
  </header>

  <div class="container">
    <div class="reset-content">
      <div class="reset-image">
        <img src="images/forgot.png" alt="Reset Password Image" height="170" width="180">
      </div>
      <div class="reset-box">
        <div class="reset-form">
          <h2>Lupa Kata Laluan</h2>
          <label for="idnumber">No. Kad Pengenalan</label>
          <input type="text" id="idnumber" placeholder="Masukkan No. Kad Pengenalan" required>
          <label for="phone">No. Tel</label>
          <input type="text" id="phone" placeholder="Masukkan No. Telefon" required>
          <label for="newPassword">Kata Laluan Baru</label>
          <input type="password" id="newPassword" placeholder="Masukkan Kata Laluan Baru" required>
          <button type="submit" onclick="resetPassword()">RESET KATA LALUAN</button>
          <p>Ingat kata laluan? <a href="login.html">Log Masuk</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
  </footer>

  <script>
    const database = firebase.database();

    async function resetPassword() {
      const idnumber = document.getElementById('idnumber').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();

      if (!idnumber || !phone || !newPassword) {
        alert('Sila isi semua maklumat.');
        return;
      }

      // Validate new password with regex rule
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
      if (!passwordRegex.test(newPassword)) {
        alert('Kata Laluan mestilah sekurang-kurangnya 6 aksara, mengandungi huruf besar, huruf kecil, nombor dan aksara khas.');
        return;
      }

      try {
        // Query the citizen users using the provided IC number
        const snapshot = await database.ref("Users/citizen")
          .orderByChild("idnumber")
          .equalTo(idnumber)
          .once("value");

        if (snapshot.exists()) {
          let updated = false;
          snapshot.forEach(child => {
            const userData = child.val();
            // Check if the phone number matches
            if (userData.phone === phone) {
              // Update the password for the matching user
              database.ref("Users/citizen/" + child.key).update({ password: newPassword })
                .then(() => {
                  alert("Kata laluan telah ditetapkan semula!");
                  window.location.href = "login.html";
                })
                .catch(error => {
                  console.error("Ralat semasa menetapkan semula kata laluan:", error);
                  alert("Ralat semasa menetapkan semula kata laluan. Sila cuba lagi.");
                });
              updated = true;
            }
          });
          if (!updated) {
            alert("Maklumat tidak sepadan. Sila semak No. Kad Pengenalan dan No. Telefon anda.");
          }
        } else {
          alert("Akaun tidak ditemui. Sila semak maklumat anda.");
        }
      } catch (error) {
        console.error("Ralat:", error);
        alert("Ralat semasa proses. Sila cuba lagi.");
      }
    }

    // Toggle navigation menu on mobile devices
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });
  </script>
</body>
</html>
