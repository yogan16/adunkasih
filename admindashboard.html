  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script>
    // Toggle nav for mobile
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });

    var database = firebase.database();

    // Retrieve logged-in user's email from localStorage
    const userEmail = localStorage.getItem("userEmail");
    if (!userEmail) {
        // Redirect to login if no session found
        window.location.href = "login.html";
    }

    // Add Pegawai Kebajikan
    function addPegawai() {
      let email = document.getElementById("pegawaiEmail").value.trim();
      let username = document.getElementById("pegawaiUsername").value;
      let password = document.getElementById("pegawaiPassword").value.trim();

      if (!email || !username || !password) {
        alert("Sila isi semua ruangan!");
        return;
      }
      let pegawaiRef = database.ref("Users/pegawai_kebajikan").push();
      pegawaiRef.set({
        email: email,
        username: username,
        password: password,
        createdAt: new Date().toString()
      })
      .then(() => {
        alert("Pegawai Kebajikan berjaya ditambah!");
        document.getElementById("pegawaiEmail").value = "";
        document.getElementById("pegawaiUsername").selectedIndex = 0;
        document.getElementById("pegawaiPassword").value = "";
      })
      .catch((error) => {
        console.error("Error adding Pegawai Kebajikan:", error);
        alert("Ralat! Tidak dapat menambah Pegawai Kebajikan.");
      });
    }

    // Add Wakil ADUN
    function addWakilAdun() {
      let email = document.getElementById("adunEmail").value.trim();
      let username = document.getElementById("adunUsername").value;
      let password = document.getElementById("adunPassword").value.trim();

      if (!email || !username || !password) {
        alert("Sila isi semua ruangan!");
        return;
      }
      let adunRef = database.ref("Users/wakil_adun").push();
      adunRef.set({
        email: email,
        username: username,
        password: password,
        createdAt: new Date().toString()
      })
      .then(() => {
        alert("Wakil ADUN berjaya ditambah!");
        document.getElementById("adunEmail").value = "";
        document.getElementById("adunUsername").selectedIndex = 0;
        document.getElementById("adunPassword").value = "";
      })
      .catch((error) => {
        console.error("Error adding Wakil ADUN:", error);
        alert("Ralat! Tidak dapat menambah Wakil ADUN.");
      });
    }
  </script>
