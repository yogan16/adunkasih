<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hubungi Kami - ADUNKASIH</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== GLOBAL RESET & FONTS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Fredoka', sans-serif;
      margin: 0;
      padding: 0;
      margin-top: 15vh; /* accommodate fixed header */
      background: url('images/kedah.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow-y: auto;
    }
    /* Dark overlay on background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: black;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      font-family: 'Times New Roman', serif;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-container img {
      height: 40px;
      width: 40px;
      object-fit: contain;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-links a:hover {
      background: white;
      color: #2c1e3c;
      border-radius: 15px;
      padding: 10px 20px;
    }

    /* ===== HAMBURGER MENU (MOBILE) ===== */
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: white;
      cursor: pointer;
      margin-left: 20px;
    }
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background: black;
        position: absolute;
        top: 60px;
        left: 0;
        z-index: 1000;
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links a {
        margin: 10px 0;
        padding: 10px 20px;
        width: 50%;
      }
      .menu-toggle {
        display: block;
        margin-right: 32px;
      }
    }

    /* ===== FOOTER ===== */
    footer {
      background: black;
      color: white;
      text-align: center;
      padding: 15px 0;
      width: 100%;
      margin-top: 20px; /* Creates space from the last content box */
    }

    /* ===== MAIN WRAPPER ===== */
    .main-wrapper {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
      margin-top: 10vh; /* space above footer */
    }

    /* ===== CONTACT CONTAINER ===== */
    .contact-container {
      background: linear-gradient(to bottom right, #f9fcff, #ffffff);
      border: 3px solid black;
      border-radius: 25px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      padding: 30px 20px;
      position: relative;
      text-align: center;
    }
    /* Larger top icon in red circle */
    .contact-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 0 auto;
      margin-top: -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }
    .contact-icon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .contact-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* ===== CONTACT BODY ===== */
    .contact-body {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: space-between;
      gap: 10px;
    }

    /* LEFT PANEL: White box with dotted line on the right */
    .left-panel {
      background: #ffffff;
      border-radius: 15px;
      flex: 1;
      min-width: 300px;
      padding: 20px;
      position: relative;
      border-right: 3px dotted #ccc;
    }
    .inner-left-container {
      background: #fff;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 20px;
    }
    .inner-right-container {
      background: #fff;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 20px;
      height: 400px;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      padding: 20px;
    }
    .right-panel-text {
      margin-top: 80px;
      margin-left: 25px;
      font-size: 16px;
      color: #333;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      font-weight: 500;
    }
    .info-icon {
      margin-left: 25px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .info-icon img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-family: 'Fredoka', sans-serif;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
    }
    .btn-submit {
      font-family: 'Fredoka', sans-serif;
      background: #bc0a0f;
      text-transform: uppercase;
      color: #fff;
      padding: 12px 40px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #333;
    }

    /* ===== KEMBALI BUTTON ===== */
    .btn-back-container {
      text-align: center;
      margin-top: 20px;
    }
    .btn-back {
      background: #bc0a0f;
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none;
    }
    .btn-back:hover {
      background: #333;
    }

    /* ===== RESPONSIVE ADJUSTMENTS ===== */
    @media (max-width: 768px) {
      .contact-body {
        flex-direction: column;
      }
      .left-panel {
        border-right: none; /* remove dotted line if you want on small screens */
        margin-bottom: 20px;
      }
      .right-panel {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Logo Malaysia">
      <img src="images/logo2.png" alt="Logo Kedah">
      <div class="logo">ADUNKASIH</div>
    </div>
    <!-- Hamburger icon (mobile) -->
    <div class="menu-toggle">&#9776;</div>
    <nav class="nav-links">
      <a href="aboutus.html">Tentang Kami</a>
      <a href="contactus.html">Hubungi Kami</a>
    </nav>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <div class="contact-container">
      <!-- Red circle icon at top center (replace with your own phone icon) -->
      <div class="contact-icon">
        <img src="images/contact-icon.png" alt="Contact Icon">
      </div>
      <div class="contact-title">HUBUNGI KAMI</div>

      <div class="contact-body">
        <!-- LEFT PANEL: White box + dotted line -->
        <div class="left-panel">
          <div class="inner-left-container">
            <form onsubmit="saveContact(event)">
              <div class="form-group">
                <label for="contactName">Nama</label>
                <input type="text" id="contactName" required />
              </div>
              <div class="form-group">
                <label for="contactPhone">Nombor Telefon</label>
                <input type="text" id="contactPhone" required />
              </div>
              <div class="form-group">
                <label for="contactComment">Komen</label>
                <textarea id="contactComment" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn-submit">Hantar</button>
            </form>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
          <div class="inner-right-container">
            <div class="right-panel-text">
              Untuk pertanyaan, bantuan teknikal, melalui maklumat hubungan yang diberikan:
            </div>
            <div class="info-item">
              <div class="info-icon">
                <img src="images/phone-icon.png" alt="Phone Icon">
              </div>
              <span id="displayPhone">Loading...</span>
            </div>
            <div class="info-item">
              <div class="info-icon">
                <img src="images/email-icon.png" alt="Email Icon">
              </div>
              <span id="displayEmail">Loading...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BOTTOM BUTTON -->
      <div class="btn-back-container">
        <a href="javascript:history.back()" class="btn-back">KEMBALI</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    Hal Cipta Terpelihara 2024 @ Kerajaan Negeri Kedah
  </footer>

  <!-- ===== FIREBASE SCRIPTS ===== -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebaseConfig.js"></script>

  <script>
    var database = firebase.database();

    // Toggle nav (mobile)
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", function () {
          navLinks.classList.toggle("active");
        });
      }
    });

    // Load phone/email from contactus/details
    function loadContactDetails() {
      database.ref("contactus/details").once("value", (snapshot) => {
        if (snapshot.exists()) {
          let data = snapshot.val();
          let phone = data.phone || "Tiada Nombor Telefon";
          let email = data.email || "Tiada Email";
          document.getElementById("displayPhone").textContent = phone;
          document.getElementById("displayEmail").textContent = email;
        } else {
          // If there's no data, show defaults
          document.getElementById("displayPhone").textContent = "Tiada Nombor Telefon";
          document.getElementById("displayEmail").textContent = "Tiada Email";
        }
      });
    }

    // Save user feedback (Nama, Phone, Comment) to contactus/feedback
    function saveContact(event) {
      event.preventDefault(); // stop form reload

      var name = document.getElementById("contactName").value.trim();
      var phone = document.getElementById("contactPhone").value.trim();
      var comment = document.getElementById("contactComment").value.trim();

      if (!name || !phone || !comment) {
        alert("Sila isi semua ruangan.");
        return;
      }

      var newContactRef = database.ref("contactus/feedback").push();
      newContactRef
        .set({
          name: name,
          phone: phone,
          comment: comment,
          timestamp: new Date().toString()
        })
        .then(() => {
          alert("Maklumat anda telah berjaya dihantar!");
          // Reset the form
          document.getElementById("contactName").value = "";
          document.getElementById("contactPhone").value = "";
          document.getElementById("contactComment").value = "";
        })
        .catch(error => {
          console.error("Ralat semasa menyimpan data:", error);
          alert("Maaf, berlaku ralat. Sila cuba lagi.");
        });
    }

    // Load the contact details on page load
    window.onload = function() {
      loadContactDetails();
    };
  </script>
</body>
</html>
